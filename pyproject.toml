[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "bluecho-sonar"
version = "0.1.4"
description = "Offline sonar inference, physics-aware inspection and source-bound review"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3.12"]
dependencies = ["numpy==1.26.4", "Pillow==12.3.0"]
[project.urls]
Homepage = "https://github.com/Sharon-codes/SIH-2026"
Repository = "https://github.com/Sharon-codes/SIH-2026"
Issues = "https://github.com/Sharon-codes/SIH-2026/issues"
[project.optional-dependencies]
inspection = ["psutil>=7,<8", "jsonschema>=4.26,<5", "pyproj==3.7.2", "pyxtf==1.4.2"]
inference = ["ultralytics==8.4.150", "opencv-python==4.11.0.86"]
onnx = ["onnxruntime==1.20.1"]
geospatial = ["rasterio==1.4.3", "pyproj==3.7.2"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "httpx>=0.27,<1"]
training = ["PyYAML==6.0.3", "psutil>=7,<8"]
dev = ["pytest>=8", "jsonschema>=4.26,<5", "build>=1.2", "twine>=6", "httpx>=0.27,<1"]
[project.scripts]
bluecho = "bluecho.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
bluecho = ["dashboard/static/*", "dashboard/static/assets/*", "*.json", "phase1/schemas/*.json", "catalog/*.json", "download_manifests/*.json", "inspection/*.json", "experiment/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
