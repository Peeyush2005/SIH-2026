name: Publish tested distributions
on:
  workflow_dispatch:
    inputs:
      tested_run_id:
        description: Successful CPU package workflow run for the release commit
        required: true
      version:
        description: Exact unused version in downloaded artifacts
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify originating workflow and commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.tested_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" > run.json
          python -c 'import json,os; r=json.load(open("run.json")); assert r["conclusion"]=="success" and r["head_sha"]==os.environ["GITHUB_SHA"] and r["path"]==".github/workflows/ci.yml"'
      - uses: actions/download-artifact@v4
        with:
          name: tested-distributions
          path: dist
          run-id: ${{ inputs.tested_run_id }}
          github-token: ${{ github.token }}
      - run: python -m pip install twine
      - run: python -m twine check dist/*
      - name: Verify version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python -c 'import glob,zipfile,email,os; w=glob.glob("dist/*.whl"); assert len(w)==1; z=zipfile.ZipFile(w[0]); m=email.message_from_bytes(z.read(next(n for n in z.namelist() if n.endswith("/METADATA")))); assert m["Name"]=="bluecho-sonar" and m["Version"]==os.environ["RELEASE_VERSION"]'
      - uses: actions/upload-artifact@v4
        with:
          name: publish-bytes
          path: dist/*
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: publish-bytes
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
