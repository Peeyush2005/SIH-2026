name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies & build
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Install PyTorch CPU & Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.4.1+cpu torchvision==0.19.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[inspection,geospatial,api,onnx,inference,dev]"

      - name: Run Pytest Suite
        run: python -m pytest tests -q

  build-and-deploy:
    name: Build Container & Deploy to Azure
    needs: test
    runs-on: ubuntu-latest
    environment: azure
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies & build for production
        # Real backend mode: builds frontend into src/bluecho/dashboard/static
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Authenticate to Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build & push container image to ACR
        run: |
          az acr build \
            --registry ${{ secrets.AZURE_ACR_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image bluecho-sonar:${{ github.sha }} \
            --image bluecho-sonar:latest \
            --file deploy/azure/Dockerfile .

      - name: Deploy container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/bluecho-sonar:${{ github.sha }}

      - name: Restart Web App
        run: |
          az webapp restart \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }}

      - name: Verify health check endpoint
        run: |
          APP_URL="https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "Verifying health check at ${APP_URL}/api/v1/health..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${APP_URL}/api/v1/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed with HTTP 200!"
              curl -s "${APP_URL}/api/v1/health"
              exit 0
            fi
            echo "Attempt $i: status $STATUS, waiting 10s..."
            sleep 10
          done
          echo "Warning: Container still warming up or health check timed out."
