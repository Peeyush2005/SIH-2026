name: CPU package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install torch==2.4.1+cpu torchvision==0.19.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install "$(echo dist/*.whl)[inspection,inference,onnx,api,dev]"
      - run: python -m pytest tests -q
      - run: python -m pip check
      - run: cd /tmp && bluecho --version && bluecho doctor
      - uses: actions/upload-artifact@v4
        with:
          name: tested-distributions
          path: dist/*
